[project]
name = "solvia-backend"
version = "0.1.0"
description = "API de Solvia: gestión inteligente de solicitudes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "email-validator>=2.3.0",
    "fastapi>=0.143",
    "httpx2>=2.13",
    "openai>=3.31",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.uv]
package = false

# ── Ruff ──
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "S", "SIM", "PT", "RET",
    "ARG", "PTH", "ERA", "PL", "RUF", "ASYNC", "T20", "TC", "DTZ", "BLE", "FBT",
]
ignore = [
    "PLR0913", # FastAPI y los constructores aceptan muchos argumentos con nombre
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0917", "ARG001"]
"app/core/errors.py" = ["S105"]
"app/schemas/auth.py" = ["S105"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

# ── Mypy ──
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── Pytest ──
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
