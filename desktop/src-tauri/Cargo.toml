[package]
name = "solvia"
version = "0.1.0"
description = "Solvia: gestión inteligente de solicitudes"
authors = ["Solvia"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
# Nombre distinto del binario para evitar conflictos en Windows (cargo#8519).
name = "solvia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
